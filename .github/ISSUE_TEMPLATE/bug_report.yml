name: Bug report
description: Something generated incorrectly, or the CLI failed
labels: [bug]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for reporting this. The most helpful thing you can include is
              **the smallest bit of OpenAPI that reproduces it**. A few lines of YAML
              are easier to work with than a long description, and they can usually
              go straight into a test case.

    - type: textarea
      id: spec
      attributes:
          label: Minimal spec
          description: The smallest OpenAPI snippet that triggers the problem.
          render: yaml
          placeholder: |
              paths:
                /users/{id}:
                  get:
                    operationId: getUser
      validations:
          required: true

    - type: textarea
      id: actual
      attributes:
          label: What QueryFish generated
          description: Paste the generated output, or the error you got.
          render: typescript
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: What you expected instead
      validations:
          required: true

    - type: textarea
      id: config
      attributes:
          label: Your queryfish.config.ts
          render: typescript

    - type: input
      id: version
      attributes:
          label: QueryFish version
          placeholder: 1.0.0
      validations:
          required: true

    - type: input
      id: node
      attributes:
          label: Node version
          placeholder: 22.11.0
