name: Feature request
description: Suggest something QueryFish should do
labels: [enhancement]
body:
    - type: markdown
      attributes:
          value: |
              QueryFish tries to do one thing: turn OpenAPI specs into React Query
              hooks. Ideas that fit that are much more likely to be accepted. The
              design principles in CONTRIBUTING.md explain what we're aiming for.

    - type: textarea
      id: problem
      attributes:
          label: What problem are you hitting?
          description: Describe the situation, not the solution.
      validations:
          required: true

    - type: textarea
      id: output
      attributes:
          label: What would you want generated?
          description: Show the ideal generated code, if you have a shape in mind.
          render: typescript

    - type: textarea
      id: alternatives
      attributes:
          label: What are you doing instead today?
